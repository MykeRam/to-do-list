<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" tabindex="0" role="region" aria-label="Todo list">
        <h1>Todo List</h1>
        <div class="input-section">
            <div class="input-slot task-slot">
                <input type="text" id="todo-input" placeholder="Add a new task..." aria-label="Task (required)" required>
            </div>
            <div class="input-slot">
                <input type="date" id="date-input" aria-label="Due date (required)" required>
            </div>
            <div class="input-actions">
                <a id="history-link" href="#history-section" aria-controls="history-section" aria-expanded="false">History</a>
                <button id="add-btn">Add</button>
            </div>
        </div>
        <aside id="rollover-prompt" class="rollover-panel" aria-labelledby="rollover-message" hidden>
            <p id="rollover-message" role="status"></p>
            <div class="rollover-actions">
                <button type="button" id="review-rollover-btn">Yes, review tasks</button>
                <button type="button" id="dismiss-rollover-btn">Not now</button>
            </div>
        </aside>
        <section aria-labelledby="today-heading">
            <h2 id="today-heading">Today</h2>
            <ul id="todo-list" class="task-list"></ul>
        </section>
        <section id="todo-grid" class="grid-container" aria-labelledby="upcoming-heading" hidden>
            <h2 id="upcoming-heading" class="grid-header"><span class="grid-heading-text">Upcoming Tasks</span></h2>
            <div class="grid-content"></div>
        </section>
        <section id="history-section" aria-labelledby="history-heading" tabindex="0" hidden>
            <div class="history-header">
                <h2 id="history-heading">History</h2>
                <button type="button" id="history-close-btn" aria-label="Close History">&times;</button>
            </div>
            <div id="rollover-controls" class="rollover-panel" hidden>
                <p>Select unfinished tasks from previous days to bring into Today.</p>
                <div class="rollover-actions">
                    <button type="button" id="rollover-all-btn">Roll over all</button>
                    <button type="button" id="rollover-selected-btn" disabled>Roll over selected</button>
                </div>
            </div>
            <p id="rollover-result" role="status"></p>
            <div id="history-content"></div>
        </section>
        <section id="notes-section" aria-labelledby="notes-heading" tabindex="0" hidden>
            <div class="history-header">
                <h2 id="notes-heading">Task notes</h2>
                <button type="button" id="notes-close-btn" aria-label="Close task notes">&times;</button>
            </div>
            <p id="notes-task-title"></p>
            <label for="task-notes">Detailed notes</label>
            <textarea id="task-notes" placeholder="Add details, ideas, or next steps…"></textarea>
            <p id="notes-save-status" role="status">Notes save automatically.</p>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
